<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ready Flow</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ready Flow">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0f11">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">

<style>
  :root{
    --bg:#0e0f11; --panel:#17191c; --panel2:#1d2024; --line:#26292e; --txt:#eceef1; --mut:#8b9099;
    --acc:#f2f2f2; --accTxt:#0e0f11; --warn:#e8b04a; --ok:#5fcf8a; --bad:#ff6b6b; --blue:#4da3ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt);font:19px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
  body{padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 14px)}
  button,label{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  h1{font-size:26.5px;font-weight:700;letter-spacing:-.01em;word-break:break-word}
  .sub{color:var(--mut);font-size:17px;margin-top:3px}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:15px;word-break:break-all}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:36px}
  .back{background:none;border:0;color:var(--blue);font-size:19px;padding:6px 0;text-align:left;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:40px;height:36px;font-size:21.5px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .lbl{font-size:17px;color:var(--mut)}
  .val{font-variant-numeric:tabular-nums;font-weight:650;font-size:20.5px;min-width:2.5ch;text-align:right}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{border:0;border-radius:13px;padding:14px 10px;font-size:19px;font-weight:600;background:var(--line);color:var(--txt);text-align:center}
  .btn.pri{background:var(--acc);color:var(--accTxt)}
  .btn.danger{background:#3a1f22;color:#ffb3b3}
  .btn.full{grid-column:1/-1}
  .btn:disabled{opacity:.45}
  .ghost{background:none;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px;font-size:18px}
  .seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{flex:1;border:0;background:transparent;color:var(--mut);font-size:17.5px;padding:8px 4px;border-radius:8px}
  .seg button.on{background:var(--line);color:var(--txt);font-weight:600}
  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ok)}
  .text{width:100%;background:var(--bg);border:1.5px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 12px;font:inherit;font-size:19px;caret-color:var(--blue)}
  .text:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(77,163,255,.28)}
  .field{display:flex;flex-direction:column;gap:6px}
  .empty{color:var(--mut);text-align:center;padding:30px 10px;font-size:18px}
  .note{font-size:15.5px;color:var(--warn)}
  .err{font-size:15.5px;color:var(--bad)}
  .hidden{display:none!important}

  /* lista paczek */
  .pack{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:9px;text-align:left;width:100%}
  .pack b{font-size:20.5px}
  .pack .meta{display:flex;justify-content:space-between;color:var(--mut);font-size:16px}

  /* zestawy */
  .set{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
  .set.ok{border-color:#24402f}
  .sethead{display:flex;align-items:center;gap:8px;min-width:0}
  .no{font-variant-numeric:tabular-nums;font-weight:700;background:var(--line);border-radius:7px;padding:2px 7px;font-size:16px;flex:none}
  .st{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:18px}
  .st i{font-style:normal;color:var(--mut);font-weight:500}
  .pill{flex:none;font-size:14.5px;font-weight:650;border-radius:99px;padding:3px 9px}
  .pill.ok{background:#173523;color:var(--ok)}
  .pill.miss{background:#3a2e14;color:var(--warn)}
  .misses{font-size:15.5px;color:var(--warn)}
  .warns{display:flex;flex-direction:column;gap:3px}
  .warns div{font-size:15.5px;color:var(--warn)}
  .warns div::before{content:"⚠︎ "}
  .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tile{position:relative;aspect-ratio:9/19.5;border-radius:12px;background:#000;border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0;width:100%}
  .tile img{width:100%;height:100%;object-fit:contain;display:block}
  .tile.ph{background:var(--panel2);border:1.5px dashed #3a3e45;color:var(--mut);flex-direction:column;gap:4px;font-size:15.5px;text-align:center;padding:6px}
  .tile.ph b{font-size:29px;font-weight:400;color:var(--txt)}
  .tile.ph.off{opacity:.55}
  .tag{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;font-weight:650;padding:2px 7px;border-radius:99px;letter-spacing:.02em}
  .dims{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#ddd;font-size:12.5px;padding:10px 4px 4px;text-align:center;font-variant-numeric:tabular-nums}
  .tile.ok-ring{box-shadow:inset 0 0 0 1.5px rgba(95,207,138,.5)}

  /* edytor */
  .ed{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;
      padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 14px)}
  .ed.on{display:block}
  .stage{position:relative;border-radius:14px;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;justify-content:center}
  .stage canvas{display:block;max-width:100%;max-height:60vh;width:auto;height:auto}
  .badge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;font-size:14.5px;padding:4px 9px;border-radius:99px;pointer-events:none;opacity:0;transition:opacity .15s}
  .badge.on{opacity:1}
  .hint{color:var(--mut);font-size:15.5px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--acc) var(--p,0%),var(--line) var(--p,0%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-11px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
  input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--acc)}
  input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0}
  .names{display:flex;flex-direction:column;gap:8px}
  .names div{display:flex;gap:8px;align-items:flex-start}
  .names .v{flex:none;width:44px;font-size:14.5px;font-weight:650;color:var(--mut);padding-top:1px}
  .names .miss{color:var(--mut);text-decoration:line-through}
  .links{display:flex;flex-direction:column;gap:6px}
  .link{background:none;border:0;color:var(--mut);font-size:17px;text-decoration:underline;padding:4px 0;text-align:left}

  /* okna */
  .dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;align-items:flex-end;justify-content:center;padding:12px 12px calc(env(safe-area-inset-bottom) + 12px)}
  .dlg.on{display:flex}
  .dlgbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow-y:auto}
  .dlgbox h3{font-size:20.5px;font-weight:650}
  .dlgbox .txt{font-size:17.5px;color:#c9ccd2;white-space:pre-line}
  .dlgbtns{display:flex;flex-direction:column;gap:8px}
  .dlgbtns .btn{width:100%;padding:13px 10px}
  #saveSheet{z-index:70}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%) translateY(20px);opacity:0;
         background:#2a2d33;color:#fff;padding:11px 16px;border-radius:12px;font-size:17px;max-width:min(92vw,520px);text-align:center;transition:.2s;pointer-events:none;z-index:80}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .busy{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .busy.on{display:flex}
  .busy>div{background:var(--panel);border:1px solid var(--line);padding:16px 18px;border-radius:14px;font-size:18px;display:flex;gap:12px;align-items:center;max-width:420px}
  .busy small{display:block;color:var(--mut);font-size:14.5px;margin-top:3px;word-break:break-all}
  .spin{width:18px;height:18px;flex:none;border-radius:50%;border:2.5px solid var(--line);border-top-color:#fff;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .ov{position:fixed;inset:0;background:#000;z-index:45;display:none;flex-direction:column;
      padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px)}
  .ov.on{display:flex}
  .ov .top{color:#ccc;font-size:15.5px;margin-bottom:10px}
  .ov .im{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  .ov img{max-width:100%;max-height:100%;object-fit:contain}
  input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Ładuję…</div></div>

<div class="ed" id="ed"></div>

<input type="file" id="fileIn" accept="image/*">

<div class="dlg" id="dlg"><div class="dlgbox" id="dlgBox"></div></div>
<div class="dlg" id="saveSheet"><div class="dlgbox">
  <h3 id="ssTitle">Plik gotowy</h3>
  <div class="mono" id="ssName"></div>
  <div class="hint" id="ssHint"></div>
  <div class="dlgbtns"><button class="btn pri" id="ssOk">Zapisz</button><button class="btn" id="ssCancel">Anuluj</button></div>
</div></div>
<div class="busy" id="busy"><div><span class="spin"></span><div><span id="busyTxt">Pracuję…</span><small id="busySub"></small></div></div></div>
<div class="toast" id="toast"></div>
<div class="ov" id="ov">
  <div class="top"><span id="ovCap" class="mono"></span><button class="ghost" id="ovClose">Zamknij</button></div>
  <div class="im"><img id="ovImg" alt=""></div>
</div>

<script>
// ================= Pamięć lokalna: zastępuje zapis Claude (IndexedDB w przeglądarce) =================
(() => {
  'use strict';
  const DB_NAME = 'readyflow', DB_VER = 1, COLLS = ['packs', 'sets'];
  const err = (code, message) => Object.assign(new Error(message || code), { code });
  const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));

  function openDb() {
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(err('unavailable'));
      let r;
      try { r = indexedDB.open(DB_NAME, DB_VER); } catch (e) { return rej(e); }
      r.onupgradeneeded = () => { const d = r.result; [...COLLS, 'blobs'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(err('blocked'));
    });
  }
  function tx(idb, store, mode, fn) {
    return new Promise((res, rej) => {
      let t; try { t = idb.transaction(store, mode); } catch (e) { return rej(e); }
      let out; const rq = fn(t.objectStore(store));
      if (rq) rq.onsuccess = () => { out = rq.result; };
      t.oncomplete = () => res(out);
      const fail = () => { const e = t.error || (rq && rq.error); rej(err(e && e.name === 'QuotaExceededError' ? 'quota_exceeded' : 'write_failed', e && e.message)); };
      t.onerror = fail; t.onabort = fail;
    });
  }
  function loadAll(idb, store) {
    return new Promise((res, rej) => {
      const out = new Map(); const t = idb.transaction(store); const c = t.objectStore(store).openCursor();
      c.onsuccess = () => { const cur = c.result; if (cur) { out.set(cur.key, cur.value); cur.continue(); } };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error);
    });
  }

  function makeDb(idb, mem) {
    const subs = new Set();
    const snap = (coll, filter) => {
      const docs = [];
      mem[coll].forEach((v, id) => { if (!filter || v[filter.f] === filter.v) docs.push({ id, exists: true, data: () => clone(v) }); });
      return { docs, size: docs.length, empty: !docs.length, metadata: { fromCache: false } };
    };
    let pending = new Set(), timer = null;
    const notify = coll => {
      pending.add(coll); if (timer) return;
      timer = setTimeout(() => {
        timer = null; const cs = pending; pending = new Set();
        subs.forEach(s => { if (cs.has(s.coll)) { try { s.cb(snap(s.coll, s.filter)); } catch (e) { console.error(e); } } });
      }, 0);
    };
    const persist = (coll, id) => { const v = mem[coll].get(id); return tx(idb, coll, 'readwrite', s => v === undefined ? s.delete(id) : s.put(v, id)); };
    const query = (coll, filter) => ({
      where: (f, op, v) => query(coll, { f, v }),
      onSnapshot(cb) {
        const s = { coll, filter, cb }; subs.add(s);
        setTimeout(() => { if (subs.has(s)) cb(snap(coll, filter)); }, 0);
        return () => subs.delete(s);
      },
      get: async () => snap(coll, filter)
    });
    const doc = path => {
      const [coll, id] = String(path).split('/');
      if (!mem[coll] || !id) throw err('bad_request', 'path ' + path);
      return {
        async set(data) { const old = mem[coll].get(id); mem[coll].set(id, clone(data)); notify(coll); try { await persist(coll, id); } catch (e) { old === undefined ? mem[coll].delete(id) : mem[coll].set(id, old); notify(coll); throw e; } },
        async update(patch) {
          const cur = mem[coll].get(id); if (!cur) throw err('not_found');
          mem[coll].set(id, Object.assign({}, cur, clone(patch))); notify(coll);
          try { await persist(coll, id); } catch (e) { mem[coll].set(id, cur); notify(coll); throw e; }
        },
        async delete() { const old = mem[coll].get(id); mem[coll].delete(id); notify(coll); try { await persist(coll, id); } catch (e) { if (old !== undefined) mem[coll].set(id, old); notify(coll); throw e; } },
        async get() { const v = mem[coll].get(id); return { id, exists: v !== undefined, data: () => clone(v) }; }
      };
    };
    return { collection: c => query(c, null), doc };
  }

  // obrazy trzymane jako ArrayBuffer + typ (pewniejsze w Safari niż Blob)
  function makeAssets(idb) {
    return {
      async upload(blob, opts) {
        const id = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        const buf = await blob.arrayBuffer();
        await tx(idb, 'blobs', 'readwrite', s => s.put({ buf, type: (opts && opts.type) || blob.type || 'application/octet-stream' }, id))
          .catch(e => { throw err(e.code === 'quota_exceeded' ? 'quota_or_state' : 'unavailable', e.message); });
        return { id };
      },
      async delete(id) { await tx(idb, 'blobs', 'readwrite', s => s.delete(id)); },
      async get(id) { const v = await tx(idb, 'blobs', 'readonly', s => s.get(id)); return v ? new Blob([v.buf], { type: v.type }) : null; }
    };
  }

  // zapis pliku: własne okienko, a z jego przycisku arkusz udostępniania iOS (Save Image / Save to Files)
  const MIME = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', zip: 'application/zip' };
  const mb = b => (b / 1048576).toFixed(1).replace('.', ',') + ' MB';
  let sheetOpen = false;
  const downloads = {
    save({ filename, data }) {
      if (sheetOpen) return Promise.reject(err('rate_limited'));
      if (!filename || data == null) return Promise.reject(err('bad_request'));
      const ext = (String(filename).split('.').pop() || '').toLowerCase();
      const blob = data instanceof Blob ? data : new Blob([data]);
      const file = new File([blob], filename, { type: MIME[ext] || blob.type || 'application/octet-stream' });
      const isImg = /^(jpe?g|png|webp)$/.test(ext);
      return new Promise((resolve, reject) => {
        sheetOpen = true;
        const sh = document.getElementById('saveSheet');
        document.getElementById('ssTitle').textContent = isImg ? 'Obraz gotowy' : 'Plik gotowy';
        document.getElementById('ssName').textContent = filename;
        document.getElementById('ssHint').textContent = mb(file.size) + ' · ' + (isImg ? 'w oknie, które się otworzy: Save Image (Zdjęcia) albo Save to Files (Pliki)' : 'w oknie, które się otworzy: Save to Files');
        sh.classList.add('on');
        const done = () => { sheetOpen = false; sh.classList.remove('on'); ok.onclick = null; cancel.onclick = null; };
        const ok = document.getElementById('ssOk'), cancel = document.getElementById('ssCancel');
        cancel.onclick = () => { done(); reject(err('declined')); };
        ok.onclick = () => {
          done();
          let canShare = false;
          try { canShare = !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch (_) { }
          if (canShare) {
            navigator.share({ files: [file] }).then(
              () => resolve({ status: 'saved' }),
              e => reject(err(e && e.name === 'AbortError' ? 'declined' : 'unavailable', e && e.message)));
            return;
          }
          try {
            const u = URL.createObjectURL(file); const a = document.createElement('a');
            a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(u), 60000);
            resolve({ status: 'saved' });
          } catch (e) { reject(err('unavailable', e && e.message)); }
        };
      });
    }
  };

  const idbP = openDb();
  idbP.catch(() => { });
  const dbP = idbP.then(async idb => { const mem = {}; for (const c of COLLS) mem[c] = await loadAll(idb, c); return makeDb(idb, mem); }).catch(() => null);
  const assetsP = idbP.then(makeAssets).catch(() => null);
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => { }); } catch (_) { }

  // adresy /_blob/ID czytane z pamięci lokalnej
  const origFetch = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = async (input, init) => {
    const url = typeof input === 'string' ? input : input && input.url;
    if (url && url.startsWith('/_blob/')) {
      const a = await assetsP; const b = a && await a.get(url.slice(7));
      return b ? new Response(b, { status: 200 }) : new Response(null, { status: 404 });
    }
    return origFetch(input, init);
  };

  const impl = { db: dbP, assets: assetsP, downloads: Promise.resolve(downloads) };
  window.claude = { use: n => impl[n] || Promise.resolve(null) };
})();
</script>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);

  // ---------------- stałe ----------------
  const MAX_PX = 16777216;              // limit powierzchni canvasu w Safari na iOS
  const PREVIEW_MAX = 1400;             // dłuższy bok podglądu rozmycia
  const THUMB_W = 220;                  // szerokość miniatury zapisywanej w danych
  const ASSET_MAX = 200 * 1024 * 1024;  // limit pojedynczego pliku w pamięci telefonu
  const CHUNK_BYTES = 350 * 1024 * 1024;// powyżej tego paczka dzieli się na części
  const PREFIX = 'RF', ROOT = 'ReadyFlow', FORMAT = 'Phone';
  const SLOTS = { lock: 'Lock', home: 'Home' };
  const DEF_BLUR = { amount: 40, dim: 0 };

  // ---------------- narzędzia ----------------
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad3 = n => String(n).padStart(3, '0');
  const genId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const mb = b => (b / 1048576).toFixed(b > 10485760 ? 0 : 1).replace('.', ',') + ' MB';

    const st = new Map(sets.map(s => [s.id, statusOf(s)]));
    const complete = sets.filter(s => st.get(s.id).complete).length;
    const inc = sets.length - complete;
    const shown = state.filter === 'inc' ? sets.filter(s => !st.get(s.id).complete) : sets;
    const cards = !state.setsReady ? `<div class="empty">Wczytuję zestawy…</div>`
      : !sets.length ? `<div class="empty">Paczka jest pusta. Dodaj pierwszy zestaw.</div>`
      : !shown.length ? `<div class="empty">Wszystkie zestawy są kompletne.</div>`
      : shown.map(s => setCard(p, s, st.get(s.id))).join('');
    app.innerHTML = `
      <div class="top"><button class="back" data-act="home">‹ Paczki</button><button class="icon" data-act="packMenu" aria-label="Opcje paczki">⋯</button></div>
      <div><h1>${esc(p.name)}</h1><div class="mono" style="color:var(--mut);margin-top:4px">${PREFIX}_${esc(p.token)}_###_auto_ujecie_${FORMAT}_wariant</div></div>
      <div class="card" style="gap:8px">
        <div class="row"><span class="lbl">Kompletne zestawy</span><span class="val">${complete}/${sets.length}</span></div>
        <div class="bar"><i style="width:${sets.length ? complete / sets.length * 100 : 0}%"></i></div>
      </div>
      <div class="btns">
        <button class="btn pri" data-act="addSet">+ Dodaj zestaw</button>
        <button class="btn" data-act="exportPack" ${complete ? '' : 'disabled'}>Zapisz paczkę</button>
      </div>
      ${sets.length ? `<div class="seg" id="filter">
        <button data-f="all" class="${state.filter === 'all' ? 'on' : ''}">Wszystkie (${sets.length})</button>
        <button data-f="inc" class="${state.filter === 'inc' ? 'on' : ''}">Niekompletne (${inc})</button></div>` : ''}
      ${cards}`;
    fillBlurThumbs(app);
  }

  function tileHtml(s, slot, big) {
    const d = s[slot];
    if (slot === 'blur') {
      if (!avail(s, 'lock')) return `<div class="tile ph off"><b>·</b><span>powstanie z Lock</span><span class="tag">Blur</span></div>`;
      const b = s.blur || DEF_BLUR;
      return `<div class="tile"><img data-blurfor="${esc(s.id)}" alt="Blur"><span class="tag">Blur · z Lock</span><span class="dims">siła ${b.amount}${b.dim ? ` · ciemniej ${b.dim}%` : ''}</span></div>`;
    }
    if (!avail(s, slot)) {
      const gone = d && d.session;
      if (big) return `<label class="tile ph" for="fileIn" data-pick="${slot}"><b>+</b><span>${gone ? 'plik zniknął,<br>wczytaj ponownie' : 'Dodaj ' + SLOTS[slot]}</span><span class="tag">${SLOTS[slot]}</span></label>`;
      return `<div class="tile ph"><b>+</b><span>brak</span><span class="tag">${SLOTS[slot]}</span></div>`;
    }
    const inner = `<img src="${esc(d.thumb)}" alt="${SLOTS[slot]}"><span class="tag">${SLOTS[slot]}</span><span class="dims">${d.w}×${d.h}${d.session ? ' · sesja' : ''}</span>`;
    return big ? `<button class="tile" data-ed="slot" data-slot="${slot}">${inner}</button>` : `<div class="tile">${inner}</div>`;
  }

  function setCard(p, s, st) {
    return `<button class="set ${st.complete ? 'ok' : ''}" data-set="${esc(s.id)}">
      <div class="sethead"><span class="no">${pad3(s.no)}</span>
        <span class="st">${esc(partToken(s.car) || 'bez nazwy auta')} <i>· ${esc(partToken(s.shot) || 'bez ujęcia')}</i></span>
        <span class="pill ${st.complete ? 'ok' : 'miss'}">${st.complete ? '✓ Kompletny' : 'Niekompletny'}</span></div>
      <div class="trio">${tileHtml(s, 'lock')}${tileHtml(s, 'home')}${tileHtml(s, 'blur')}</div>
      ${st.complete ? '' : `<div class="misses">Brakuje: ${esc(st.miss.join(', '))}</div>`}
      ${st.warns.length ? `<div class="warns">${st.warns.map(w => `<div>${esc(w)}</div>`).join('')}</div>` : ''}
    </button>`;
  }

  // ---------------- nawigacja ----------------
  function route() {
    const m = location.hash.slice(1).match(/^p-([A-Za-z0-9]+)$/);
    if (m) openPack(m[1]); else openHome();
  }
  function stopSets() { if (state.unsubSets) { state.unsubSets(); state.unsubSets = null; } }
  function openHome() {
    closeEditor(); stopSets();
    state.packId = null; state.sets = []; state.setsReady = false; blobCache.clear();
    render(); window.scrollTo(0, 0);
  }
  function openPack(id) {
    if (state.packId === id && state.unsubSets) { render(); return; }
    closeEditor(); stopSets(); blobCache.clear();
    state.packId = id; state.sets = []; state.setsReady = false; state.filter = 'all';
    render(); window.scrollTo(0, 0);
    if (!state.db) return;
    state.unsubSets = state.db.collection('sets').where('packId', '==', id).onSnapshot(snap => {
      if (state.packId !== id) return;
      state.sets = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => (a.no || 0) - (b.no || 0));
      state.setsReady = true;
      render();
      if (state.edId) updateEditor();
    }, () => { state.setsReady = true; toast('Nie udało się wczytać zestawów. Odśwież stronę.', 5000); render(); });
  }
  window.addEventListener('hashchange', route);

  // ---------------- akcje: paczki ----------------
  const packHint = v => { const t = packToken(v.name); return t ? `W nazwach plików: ${PREFIX}_${esc(t)}_001_…` : ''; };
  function packValidate(v, selfId) {
    const t = packToken(v.name);
    if (!t) return 'Wpisz nazwę paczki (litery lub cyfry).';
    const d = state.packs.find(p => p.id !== selfId && p.token.toLowerCase() === t.toLowerCase());
    if (d) return `Paczka „${d.name}” ma już tę nazwę w plikach (${t}). Wybierz inną.`;
    return '';
  }
  async function newPack() {
    const v = await askFields({ title: 'Nowa paczka', fields: [{ key: 'name', label: 'Nazwa paczki', placeholder: 'Night Shift' }], hint: packHint, validate: v => packValidate(v), ok: 'Utwórz' });
    if (!v) return;
    const id = genId('p');
    const ok = await dbw(state.db.doc('packs/' + id).set({ name: v.name, token: packToken(v.name), format: FORMAT, nextNo: 1, total: 0, complete: 0, blur: Object.assign({}, DEF_BLUR), createdAt: Date.now() }), 'paczka');
    if (ok) location.hash = 'p-' + id;
  }
  async function packMenu() {
    const p = curPack(); if (!p) return;
    const r = await ask({ title: p.name, buttons: [
      { label: 'Zmień nazwę paczki', value: 'rename' },
      { label: 'Usuń paczkę', value: 'delete', kind: 'danger' },
      { label: 'Anuluj', value: null }] });
    if (r === 'rename') {
      const v = await askFields({ title: 'Nazwa paczki', text: 'Zmiana nazwy zmieni nazwy wszystkich plików w tej paczce przy następnym eksporcie.', fields: [{ key: 'name', label: 'Nazwa paczki', value: p.name }], hint: packHint, validate: v => packValidate(v, p.id) });
      if (v) await dbw(state.db.doc('packs/' + p.id).update({ name: v.name, token: packToken(v.name) }), 'nazwa');
    } else if (r === 'delete') {
      const n = state.sets.length;
      const c = await ask({ title: `Usunąć paczkę „${p.name}”?`, text: `Zniknie ${n} ${n === 1 ? 'zestaw' : 'zestawów'} razem z zapisanymi obrazami. Tego nie da się cofnąć.`, buttons: [{ label: 'Usuń paczkę', value: true, kind: 'danger' }, { label: 'Anuluj', value: false }] });
      if (!c) return;
      setBusy(true, 'Usuwam paczkę…');
      try {
        for (const s of [...state.sets]) await deleteSetData(s);
        await state.db.doc('packs/' + p.id).delete();
        location.hash = '';
      } catch (_) { toast('Nie udało się usunąć wszystkiego. Spróbuj jeszcze raz.'); }
      finally { setBusy(false); }
    }
  }

  // ---------------- akcje: zestawy ----------------
  async function addSet() {
    const p = curPack(); if (!p) return;
    const last = state.sets[state.sets.length - 1];
    const maxNo = state.sets.reduce((m, s) => Math.max(m, s.no || 0), 0);
    const no = Math.max(p.nextNo || 1, maxNo + 1);
    const v = await askFields({
      title: `Nowy zestaw ${pad3(no)}`,
      fields: [{ key: 'car', label: 'Model auta', value: last ? last.car : '', placeholder: 'Silvia S12' }, { key: 'shot', label: 'Nazwa ujęcia', placeholder: 'Laundromat' }],
      hint: v => {
        const n = fileName(p, { no, car: v.car, shot: v.shot }, 'Lock', 'jpg');
        const d = state.sets.filter(s => partToken(v.car) && partToken(v.shot) && same(s.car, v.car) && same(s.shot, v.shot));
        return esc(n) + (d.length ? `<div class="note" style="font-family:inherit;margin-top:6px">To auto i ujęcie jest już w zestawie ${d.map(s => pad3(s.no)).join(', ')}.</div>` : '');
      },
      validate: v => !partToken(v.car) ? 'Wpisz model auta.' : !partToken(v.shot) ? 'Wpisz nazwę ujęcia.' : '',
      ok: 'Dodaj zestaw'
    });
    if (!v) return;
    const id = genId('s');
    const data = { packId: p.id, no, car: v.car, shot: v.shot, lock: null, home: null, blur: Object.assign({}, p.blur || DEF_BLUR), createdAt: Date.now(), updatedAt: Date.now() };
    if (!await dbw(state.db.doc('sets/' + id).set(data), 'zestaw')) return;
    await dbw(state.db.doc('packs/' + p.id).update({ nextNo: no + 1 }), 'numer');
    if (!state.sets.find(s => s.id === id)) { state.sets.push(Object.assign({ id }, data)); state.sets.sort((a, b) => a.no - b.no); render(); }
    syncCounts();
    openEditor(id);
  }

  async function deleteSetData(s) {
    await state.db.doc('sets/' + s.id).delete();
    for (const k of ['lock', 'home']) {
      sessionFiles.delete(sKey(s.id, k));
      if (s[k] && s[k].asset && state.assets) { blobCache.delete(s[k].asset); try { await state.assets.delete(s[k].asset); } catch (_) { } }
    }
  }

  // ---------------- edytor zestawu ----------------
  const ed = {
    local: null,      // { car, shot, amount, dim }
    touchT: 0,        // ostatni ruch suwakiem
    saveT: null, blurT: null,
    lockKey: null, orig: null, last: null, pW: 0, pH: 0, busy: false, pending: false, holding: false, token: 0
  };

  function openEditor(id) {
    const s = state.sets.find(x => x.id === id); const p = curPack(); if (!s || !p) return;
    state.edId = id;
    const b = s.blur || DEF_BLUR;
    ed.local = { car: s.car || '', shot: s.shot || '', amount: b.amount, dim: b.dim };
    ed.lockKey = null; ed.orig = null; ed.last = null;
    const el = $('ed');
    el.innerHTML = `<div class="wrap">
      <div class="top"><button class="back" data-ed="close">‹ ${esc(p.name)}</button><span class="no" id="edNo" style="font-size:18px"></span></div>
      <div class="card">
        <div class="field"><span class="lbl">Model auta</span><input class="text" id="edCar" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"></div>
        <div class="field"><span class="lbl">Nazwa ujęcia</span><input class="text" id="edShot" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"></div>
      </div>
      <div id="edStatus"></div>
      <div class="trio" id="edTrio"></div>
      <div class="card" id="blurCard">
        <div class="row"><span class="lbl" style="color:var(--txt);font-weight:600">Blur z obrazu Lock</span><span class="hint" id="blurRes"></span></div>
        <div class="stage" id="stage"><canvas id="cv"></canvas><div class="badge" id="badge">Lock bez rozmycia</div></div>
        <div class="hint">Przytrzymaj palec na obrazie, żeby porównać z Lock.</div>
        <div><div class="row"><span class="lbl">Siła rozmycia</span><span class="val" id="amtVal"></span></div>
          <input type="range" id="amt" min="0" max="100" step="1"></div>
        <div><div class="row"><span class="lbl">Przyciemnienie</span><span class="val" id="dimVal"></span></div>
          <input type="range" id="dim" min="0" max="70" step="1"></div>
        <div class="links">
          <button class="link" data-ed="blurDefault">Ustaw jako domyślne dla nowych zestawów</button>
          <button class="link" data-ed="blurAll">Zastosuj do wszystkich zestawów w paczce</button>
        </div>
      </div>
      <div class="card" id="blurEmpty"><div class="hint">Dodaj obraz Lock, a Blur powstanie z niego automatycznie.</div></div>
      <div class="card"><span class="lbl">Nazwy plików</span><div class="names" id="edNames"></div>
        <div class="hint">Lock i Home trafiają do paczki bez zmian, w oryginalnej rozdzielczości. Blur zapisuje się jako JPG. „Zapisz osobno” otwiera okno zapisu po kolei dla każdego pliku, więc każdy zapiszesz tam, gdzie chcesz.</div></div>
      <div class="btns">
        <button class="btn pri" data-ed="exportFiles">Zapisz osobno</button>
        <button class="btn" data-ed="export">Zapisz jako ZIP</button>
        <button class="btn danger full" data-ed="delete">Usuń zestaw</button>
      </div>
    </div>`;
    el.classList.add('on'); el.scrollTop = 0;
    document.body.style.overflow = 'hidden';

    const car = $('edCar'), shot = $('edShot');
    car.value = ed.local.car; shot.value = ed.local.shot;
    const onName = () => { ed.local.car = car.value; ed.local.shot = shot.value; updateEditor(); scheduleNameSave(); };
    car.addEventListener('input', onName); shot.addEventListener('input', onName);
    [car, shot].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); i.blur(); } }));
    [car, shot].forEach(i => i.addEventListener('blur', flushNameSave));

    const amt = $('amt'), dim = $('dim');
    amt.value = ed.local.amount; dim.value = ed.local.dim;
    const onBlur = () => {
      ed.local.amount = +amt.value; ed.local.dim = +dim.value; ed.touchT = Date.now();
      showBlurVals(); renderPreview(); scheduleBlurSave();
    };
    amt.addEventListener('input', onBlur); dim.addEventListener('input', onBlur);
    showBlurVals();

    const stage = $('stage');
    stage.addEventListener('pointerdown', e => { e.preventDefault(); showOrig(true); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => stage.addEventListener(t, () => ed.holding && showOrig(false)));
    stage.addEventListener('contextmenu', e => e.preventDefault());

    updateEditor();
  }

  function showBlurVals() {
    $('amtVal').textContent = ed.local.amount; $('dimVal').textContent = ed.local.dim + '%';
    paintRange($('amt')); paintRange($('dim'));
  }

  function closeEditor() {
    if (!state.edId) return;
    flushNameSave(); flushBlurSave();
    state.edId = null; ed.token++;
    $('ed').classList.remove('on'); $('ed').innerHTML = '';
    document.body.style.overflow = '';
    render();
  }

  function updateEditor() {
    const s = curSet(), p = curPack();
    if (!s || !p) { if (state.setsReady) closeEditor(); return; }
    // pola tekstowe: nie nadpisuję tego, co właśnie piszesz
    const car = $('edCar'), shot = $('edShot');
    if (document.activeElement !== car && document.activeElement !== shot && !ed.saveT) {
      ed.local.car = s.car || ''; ed.local.shot = s.shot || '';
      if (car.value !== ed.local.car) car.value = ed.local.car;
      if (shot.value !== ed.local.shot) shot.value = ed.local.shot;
    }
    const b = s.blur || DEF_BLUR;
    if (Date.now() - ed.touchT > 1500 && !ed.blurT && (b.amount !== ed.local.amount || b.dim !== ed.local.dim)) {
      ed.local.amount = b.amount; ed.local.dim = b.dim; $('amt').value = b.amount; $('dim').value = b.dim; showBlurVals(); renderPreview();
    }
    $('edNo').textContent = 'Zestaw ' + pad3(s.no);

    const st = statusOf(s, ed.local);
    $('edStatus').innerHTML = `<div class="card" style="gap:6px">
      <div class="row"><span class="pill ${st.complete ? 'ok' : 'miss'}">${st.complete ? '✓ Kompletny' : 'Niekompletny'}</span></div>
      ${st.complete ? '' : `<div class="misses">Brakuje: ${esc(st.miss.join(', '))}</div>`}
      ${st.warns.length ? `<div class="warns">${st.warns.map(w => `<div>${esc(w)}</div>`).join('')}</div>` : ''}
    </div>`;

    // trzy warianty obok siebie (Blur liczony z bieżących ustawień suwaków)
    const view = Object.assign({}, s, { blur: { amount: ed.local.amount, dim: ed.local.dim } });
    $('edTrio').innerHTML = tileHtml(view, 'lock', true) + tileHtml(view, 'home', true) +
      (avail(s, 'lock') ? `<button class="tile" data-ed="viewBlur"><img id="edBlurImg" alt="Blur"><span class="tag">Blur · z Lock</span></button>` : tileHtml(view, 'blur', true));
    paintEdBlurTile();

    const hasLock = avail(s, 'lock');
    $('blurCard').classList.toggle('hidden', !hasLock);
    $('blurEmpty').classList.toggle('hidden', hasLock);

    const rows = [
      ['Lock', avail(s, 'lock') ? fileName(p, s, 'Lock', s.lock.ext, ed.local) : fileName(p, s, 'Lock', 'jpg', ed.local), avail(s, 'lock')],
      ['Home', avail(s, 'home') ? fileName(p, s, 'Home', s.home.ext, ed.local) : fileName(p, s, 'Home', 'jpg', ed.local), avail(s, 'home')],
      ['Blur', fileName(p, s, 'Blur', 'jpg', ed.local), hasLock]
    ];
    $('edNames').innerHTML = rows.map(r => `<div><span class="v">${r[0]}</span><span class="mono ${r[2] ? '' : 'miss'}">${esc(r[1])}</span></div>`).join('');

    if (hasLock) {
      const f = fitMax(s.lock.w, s.lock.h);
      $('blurRes').textContent = `${f.w}×${f.h}`;
      const key = s.lock.asset || sKey(s.id, 'lock') + (s.lock.sig || '');
      if (ed.lockKey !== key) { ed.lockKey = key; loadPreview(s); }
    } else { ed.lockKey = null; ed.orig = null; }
  }

  function paintEdBlurTile() {
    const img = $('edBlurImg'); if (!img) return;
    if (ed.last) { img.src = cvSnapshot(); return; }
    const s = curSet(); if (!s) return;
    blurThumb(Object.assign({}, s, { blur: { amount: ed.local.amount, dim: ed.local.dim } })).then(u => { if (u && !ed.last && $('edBlurImg')) $('edBlurImg').src = u; }).catch(() => {});
  }
  let snapT = 0, snapUrl = '';
  function cvSnapshot() {
    // mała kopia podglądu do kafelka (odświeżana najwyżej co 250 ms)
    const now = Date.now();
    if (snapUrl && now - snapT < 250) return snapUrl;
    const c = document.createElement('canvas'); c.width = THUMB_W; c.height = Math.round(ed.pH * THUMB_W / ed.pW);
    const x = c.getContext('2d'); const t = document.createElement('canvas'); t.width = ed.pW; t.height = ed.pH;
    t.getContext('2d').putImageData(ed.last, 0, 0); x.drawImage(t, 0, 0, c.width, c.height);
    snapUrl = c.toDataURL('image/jpeg', 0.8); snapT = now; return snapUrl;
  }

  async function loadPreview(s) {
    const tok = ++ed.token;
    ed.orig = null; ed.last = null;
    try {
      const blob = await blobFor(s, 'lock', true);
      const im = await loadImg(blob);
      if (tok !== ed.token) return;
      const ps = Math.min(1, PREVIEW_MAX / Math.max(im.naturalWidth, im.naturalHeight));
      ed.pW = Math.max(1, Math.round(im.naturalWidth * ps)); ed.pH = Math.max(1, Math.round(im.naturalHeight * ps));
      const cv = $('cv'); if (!cv) return;
      cv.width = ed.pW; cv.height = ed.pH;
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, ed.pW, ed.pH);
      ctx.drawImage(im, 0, 0, ed.pW, ed.pH);
      ed.orig = ctx.getImageData(0, 0, ed.pW, ed.pH);
      renderPreview();
    } catch (_) {
      if (tok === ed.token) toast('Nie udało się wczytać obrazu Lock do podglądu.');
    }
  }
  async function renderPreview() {
    if (!ed.orig) return;
    if (ed.busy) { ed.pending = true; return; }
    ed.busy = true;
    const tok = ed.token;
    const copy = new Uint8ClampedArray(ed.orig.data);
    const buf = await runBlur(copy, ed.pW, ed.pH, sigmaFor(ed.pW, ed.pH, ed.local.amount), ed.local.dim);
    ed.busy = false;
    if (tok !== ed.token || !$('cv')) return;
    ed.last = new ImageData(new Uint8ClampedArray(buf), ed.pW, ed.pH);
    if (!ed.holding) $('cv').getContext('2d').putImageData(ed.last, 0, 0);
    snapT = 0; const img = $('edBlurImg'); if (img) img.src = cvSnapshot();
    if (ed.pending) { ed.pending = false; renderPreview(); }
  }
  function showOrig(on) {
    ed.holding = on; $('badge').classList.toggle('on', on);
    if (!ed.orig) return;
    $('cv').getContext('2d').putImageData(on ? ed.orig : (ed.last || ed.orig), 0, 0);
  }

  // zapisy z edytora (z opóźnieniem, jeden naraz)
  function scheduleNameSave() { clearTimeout(ed.saveT); ed.saveT = setTimeout(flushNameSave, 700); }
  function flushNameSave() {
    if (!ed.saveT) return; clearTimeout(ed.saveT); ed.saveT = null;
    const s = curSet(); if (!s) return;
    if ((s.car || '') === ed.local.car && (s.shot || '') === ed.local.shot) return;
    dbw(state.db.doc('sets/' + s.id).update({ car: ed.local.car.trim(), shot: ed.local.shot.trim(), updatedAt: Date.now() }), 'nazwy').then(syncCounts);
  }
  function scheduleBlurSave() { clearTimeout(ed.blurT); ed.blurT = setTimeout(flushBlurSave, 600); }
  function flushBlurSave() {
    if (!ed.blurT) return; clearTimeout(ed.blurT); ed.blurT = null;
    const s = curSet(); if (!s) return;
    const b = s.blur || DEF_BLUR;
    if (b.amount === ed.local.amount && b.dim === ed.local.dim) return;
    dbw(state.db.doc('sets/' + s.id).update({ blur: { amount: ed.local.amount, dim: ed.local.dim }, updatedAt: Date.now() }), 'rozmycie');
  }

  // ---------------- przypisanie pliku do Lock/Home ----------------
  async function assignFile(file, slot) {
    const s = curSet(), p = curPack(); if (!s || !p) return;
    const name = SLOTS[slot];
    setBusy(true, 'Wczytuję obraz…', file.name || '');
    let im, blob = file, type = (file.type || '').toLowerCase(), converted = false;
    try { im = await loadImg(file); }
    catch (_) { setBusy(false); toast('Nie mogę otworzyć tego pliku. Wybierz JPG, PNG albo WebP.'); return; }
    const w = im.naturalWidth, h = im.naturalHeight;
    try {
      if (!/^image\/(jpeg|png|webp)$/.test(type)) { blob = await reencodeJpg(im); type = 'image/jpeg'; converted = true; }
      const sig = await hashBuf(await blob.arrayBuffer()) || `${blob.size}-${w}x${h}`;
      setBusy(false);

      // ten sam plik gdzie indziej w paczce
      const hits = [];
      state.sets.forEach(o => ['lock', 'home'].forEach(k => { if (o[k] && o[k].sig === sig && !(o.id === s.id && k === slot)) hits.push(`${pad3(o.no)} (${SLOTS[k]})`); }));
      if (hits.length) {
        const r = await ask({ title: 'Ten plik już jest w paczce', text: `Ten sam obraz jest przypisany w: ${hits.join(', ')}.\nNa pewno chcesz użyć go też jako ${name} w zestawie ${pad3(s.no)}?`,
          buttons: [{ label: 'Przypisz mimo to', value: true, kind: 'danger' }, { label: 'Anuluj', value: false }] });
        if (!r) return;
      }
      // zastąpienie istniejącego pliku
      const old = s[slot];
      if (old && (old.asset || old.session)) {
        if (old.sig === sig) { toast(`To ten sam plik, który już jest w ${name}.`); return; }
        const r = await ask({ title: `Zastąpić ${name} w zestawie ${pad3(s.no)}?`,
          text: `Obecny: ${old.src || 'bez nazwy'} · ${old.w}×${old.h}\nNowy: ${file.name || 'bez nazwy'} · ${w}×${h}\n\nPoprzedni plik zostanie usunięty z aplikacji.`,
          buttons: [{ label: 'Zastąp', value: true, kind: 'danger' }, { label: 'Anuluj', value: false }] });
        if (!r) return;
      }

      // zapis pliku
      let asset = null, session = false;
      if (blob.size > ASSET_MAX || !state.assets) {
        const choice = await ask({
          title: state.assets ? 'Plik jest za duży do zapisania' : 'Zapis obrazów niedostępny',
          text: state.assets
            ? `${file.name || 'Plik'} ma ${mb(blob.size)}, a aplikacja zapisuje najwyżej 200 MB na plik.`
            : 'Nie mogę zapisać obrazów w pamięci telefonu.',
          buttons: [
            ...(state.assets && type !== 'image/jpeg' ? [{ label: 'Zapisz jako JPG (jakość 95%)', value: 'jpg', kind: 'pri' }] : []),
            { label: 'Użyj tylko w tej sesji', value: 'session' },
            { label: 'Anuluj', value: null }]
        });
        if (!choice) return;
        if (choice === 'jpg') {
          setBusy(true, 'Zamieniam na JPG…');
          blob = await reencodeJpg(im); type = 'image/jpeg'; converted = true;
          setBusy(false);
          if (blob.size > ASSET_MAX) {
            const c2 = await ask({ title: 'Nadal za duży', text: `Po zamianie plik ma ${mb(blob.size)}. Mogę go użyć tylko w tej sesji: wyeksportuj zestaw, zanim zamkniesz aplikację.`, buttons: [{ label: 'Użyj w tej sesji', value: true, kind: 'pri' }, { label: 'Anuluj', value: false }] });
            if (!c2) return; session = true;
          }
        } else session = true;
      }
      if (!session) {
        setBusy(true, `Zapisuję ${name}…`, `${mb(blob.size)}`);
        try {
          const r = await state.assets.upload(blob, { type });
          asset = r.id; blobCache.set(asset, blob);
        } catch (e) {
          setBusy(false);
          const code = e && e.code;
          const msg = code === 'quota_or_state' ? 'Pamięć telefonu dla aplikacji jest pełna.'
            : code === 'too_large' ? 'Plik jest za duży.'
            : code === 'rate_limited' ? 'Za dużo zapisów naraz.'
            : 'Nie udało się zapisać obrazu.';
          const c3 = await ask({ title: msg, text: 'Mogę użyć obrazu tylko w tej sesji: wyeksportuj zestaw, zanim zamkniesz aplikację.', buttons: [{ label: 'Użyj w tej sesji', value: true, kind: 'pri' }, { label: 'Anuluj', value: false }] });
          if (!c3) return; session = true;
        }
      }
      setBusy(true, `Zapisuję ${name}…`);
      const fw = converted ? fitMax(w, h).w : w, fh = converted ? fitMax(w, h).h : h;
      const data = { asset, session, w: fw, h: fh, ext: extOf(type), bytes: blob.size, src: file.name || '', sig, thumb: makeThumb(im), at: Date.now() };
      if (session) sessionFiles.set(sKey(s.id, slot), blob); else sessionFiles.delete(sKey(s.id, slot));
      const ok = await dbw(state.db.doc('sets/' + s.id).update({ [slot]: data, updatedAt: Date.now() }), name);
      if (!ok) { if (asset) state.assets.delete(asset).catch(() => {}); return; }
      if (old && old.asset && old.asset !== asset && state.assets) { blobCache.delete(old.asset); state.assets.delete(old.asset).catch(() => {}); }
      syncCounts();
      toast(`${name} gotowy${converted ? ' (zapisany jako JPG)' : ''}${session ? ' · tylko w tej sesji' : ''}`);
    } catch (_) {
      toast('Coś poszło nie tak przy wczytywaniu obrazu. Spróbuj jeszcze raz.');
    } finally { setBusy(false); }
  }

  async function slotMenu(slot) {
    const s = curSet(); if (!s) return;
    const d = s[slot]; const name = SLOTS[slot];
    const r = await ask({ title: `${name} · zestaw ${pad3(s.no)}`, text: `${d.src || 'bez nazwy'} · ${d.w}×${d.h} · ${mb(d.bytes || 0)}${d.session ? '\nPlik tylko w tej sesji.' : ''}`,
      buttons: [{ label: 'Podgląd', value: 'view' }, { label: 'Zastąp plik', file: slot }, { label: `Usuń ${name} z zestawu`, value: 'del', kind: 'danger' }, { label: 'Anuluj', value: null }] });
    if (r === 'view') {
      const p = curPack();
      const cap = fileName(p, s, name, d.ext, ed.local);
      try {
        const b = await blobFor(s, slot, true);
        if (ovUrl) URL.revokeObjectURL(ovUrl); ovUrl = URL.createObjectURL(b); openView(ovUrl, cap);
      } catch (_) { toast('Nie udało się wczytać obrazu.'); }
    } else if (r === 'del') {
      const c = await ask({ title: `Usunąć ${name}?`, text: `Zestaw ${pad3(s.no)} stanie się niekompletny.`, buttons: [{ label: 'Usuń', value: true, kind: 'danger' }, { label: 'Anuluj', value: false }] });
      if (!c) return;
      if (await dbw(state.db.doc('sets/' + s.id).update({ [slot]: null, updatedAt: Date.now() }), name)) {
        sessionFiles.delete(sKey(s.id, slot));
        if (d.asset && state.assets) { blobCache.delete(d.asset); state.assets.delete(d.asset).catch(() => {}); }
        syncCounts();
      }
    }
  }

  async function deleteSet() {
    const s = curSet(); if (!s) return;
    const c = await ask({ title: `Usunąć zestaw ${pad3(s.no)}?`, text: 'Zestaw zniknie razem z obrazami. Numery pozostałych zestawów się nie zmienią, a ten numer nie zostanie użyty ponownie.', buttons: [{ label: 'Usuń zestaw', value: true, kind: 'danger' }, { label: 'Anuluj', value: false }] });
    if (!c) return;
    ed.saveT && clearTimeout(ed.saveT); ed.saveT = null; ed.blurT && clearTimeout(ed.blurT); ed.blurT = null;
    setBusy(true, 'Usuwam zestaw…');
    try { await deleteSetData(s); closeEditor(); syncCounts(); }
    catch (_) { toast('Nie udało się usunąć zestawu.'); }
    finally { setBusy(false); }
  }

  async function blurToAll() {
    const p = curPack(); if (!p) return;
    const b = { amount: ed.local.amount, dim: ed.local.dim };
    const c = await ask({ title: 'Zastosować do wszystkich?', text: `Siła ${b.amount}, przyciemnienie ${b.dim}% dla wszystkich ${state.sets.length} zestawów w paczce i jako domyślne dla nowych.`, buttons: [{ label: 'Zastosuj', value: true, kind: 'pri' }, { label: 'Anuluj', value: false }] });
    if (!c) return;
    flushBlurSave();
    setBusy(true, 'Zapisuję ustawienia…');
    try {
      for (const s of state.sets) {
        const o = s.blur || DEF_BLUR;
        if (o.amount !== b.amount || o.dim !== b.dim) await state.db.doc('sets/' + s.id).update({ blur: b, updatedAt: Date.now() });
      }
      await state.db.doc('packs/' + p.id).update({ blur: b });
      toast('Ustawienia rozmycia zapisane dla całej paczki.');
    } catch (_) { toast('Nie wszystkie zestawy udało się zaktualizować.'); }
    finally { setBusy(false); }
  }

  // ---------------- eksport ----------------
  // lista plików do eksportu i kontrola duplikatów nazw
  async function buildGroups(p, sets) {
    const groups = sets.map(s => {
      const items = [];
      if (avail(s, 'lock')) items.push({ s, v: 'Lock', slot: 'lock', name: fileName(p, s, 'Lock', s.lock.ext) });
      if (avail(s, 'home')) items.push({ s, v: 'Home', slot: 'home', name: fileName(p, s, 'Home', s.home.ext) });
      if (avail(s, 'lock')) items.push({ s, v: 'Blur', slot: 'blur', name: fileName(p, s, 'Blur', 'jpg') });
      const est = (avail(s, 'lock') ? s.lock.bytes * 2.3 : 0) + (avail(s, 'home') ? s.home.bytes : 0);
      return { s, items, est };
    }).filter(g => g.items.length);
    const seen = new Map(), dup = [];
    groups.forEach(g => g.items.forEach(it => { const k = it.name.toLowerCase(); if (seen.has(k)) dup.push(it.name); seen.set(k, 1); }));
    if (dup.length) {
      await ask({ title: 'Powtarzające się nazwy plików', text: `Te nazwy występują więcej niż raz:\n${dup.join('\n')}\n\nPopraw auto lub ujęcie w tych zestawach.`, buttons: [{ label: 'OK', value: true }] });
      return null;
    }
    return groups;
  }
  async function canSave() {
    if (state.downloads) return true;
    await ask({ title: 'Zapis plików niedostępny', text: 'Ta przeglądarka nie pozwala zapisywać plików.', buttons: [{ label: 'OK', value: true }] });
    return false;
  }
  async function itemBlob(it, scaled) {
    if (it.slot !== 'blur') return blobFor(it.s, it.slot);
    // Blur zawsze powstaje z obrazu Lock
    const r = await renderBlurFull(await blobFor(it.s, 'lock'), it.s.blur || DEF_BLUR);
    if (r.scaled) scaled.push(`${it.name} (${r.w}×${r.h})`);
    return r.blob;
  }

  // zapis plików po kolei: każdy trafia tam, gdzie wskażesz w oknie zapisu
  async function saveSeparate(sets) {
    const p = curPack(); if (!p || !sets.length || !await canSave()) return;
    flushBlurSave(); flushNameSave();
    const groups = await buildGroups(p, sets); if (!groups) return;
    const items = groups.flatMap(g => g.items);
    const failed = [], scaled = [], skipped = [];
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      setBusy(true, `Przygotowuję plik ${i + 1}/${items.length}`, it.name);
      await sleep(20);
      let blob;
      try { blob = await itemBlob(it, scaled); }
      catch (_) { failed.push(it.name); continue; }
      finally { setBusy(false); }
      if (i > 0) await sleep(400);
      let tries = 0, res;
      while (true) {
        try { await state.downloads.save({ filename: it.name, data: blob }); res = 'ok'; break; }
        catch (e) {
          const code = e && e.code;
          if (code === 'declined') {
            const r = await ask({ title: 'Pominięto plik', text: it.name, buttons: [{ label: 'Dalej', value: true, kind: 'pri' }, { label: 'Przerwij', value: false }] });
            res = r ? 'skip' : 'stop'; break;
          }
          if (tries++ < 2 && code !== 'too_large' && code !== 'unavailable' && code !== 'not_granted') {
            const r = await ask({ title: `Plik ${i + 1}/${items.length} gotowy`, text: it.name, buttons: [{ label: 'Zapisz', value: true, kind: 'pri' }, { label: 'Przerwij', value: false }] });
            if (!r) { res = 'stop'; break; }
            continue;
          }
          res = 'fail'; break;
        }
      }
      if (res === 'stop') return;
      if (res === 'skip') skipped.push(it.name);
      if (res === 'fail') failed.push(it.name);
    }
    const notes = [];
    if (failed.length) notes.push(`Nie udało się zapisać:\n${failed.join('\n')}`);
    if (skipped.length) notes.push(`Pominięte:\n${skipped.join('\n')}`);
    if (scaled.length) notes.push(`Zmniejszone przez limit Safari (16,7 Mpx):\n${scaled.join('\n')}`);
    if (notes.length) await ask({ title: 'Zapis zakończony z uwagami', text: notes.join('\n\n'), buttons: [{ label: 'OK', value: true }] });
    else toast(`Zapisano ${items.length} ${items.length >= 2 && items.length <= 4 ? 'pliki' : 'plików'}.`, 4000);
  }

  async function exportSets(sets, base, flat) {
    const p = curPack(); if (!p || !sets.length || !await canSave()) return;
    flushBlurSave(); flushNameSave();
    const groups = await buildGroups(p, sets); if (!groups) return;
    // podział na części, żeby telefonowi nie zabrakło pamięci
    const chunks = [[]]; let acc = 0;
    for (const g of groups) {
      if (acc + g.est > CHUNK_BYTES && chunks[chunks.length - 1].length) { chunks.push([]); acc = 0; }
      chunks[chunks.length - 1].push(g); acc += g.est;
    }
    const total = groups.reduce((n, g) => n + g.items.length, 0);
    let done = 0; const failed = []; const scaled = []; const packed = [];
    for (let ci = 0; ci < chunks.length; ci++) {
      if (ci > 0) {
        const go = await ask({ title: `Część ${ci} z ${chunks.length} gotowa`, text: 'Przygotować następną część paczki?', buttons: [{ label: `Przygotuj część ${ci + 1}`, value: true, kind: 'pri' }, { label: 'Przerwij', value: false }] });
        if (!go) return;
      }
      const zip = new Zip();
      try {
        for (const g of chunks[ci]) {
          for (const it of g.items) {
            done++;
            setBusy(true, `Pakuję ${done}/${total}${chunks.length > 1 ? ` · część ${ci + 1}/${chunks.length}` : ''}`, it.name);
            await sleep(20);
            try {
              const blob = await itemBlob(it, scaled);
              const u8 = new Uint8Array(await blob.arrayBuffer());
              if (!u8.length) throw new Error('empty');
              zip.add(flat ? it.name : zipPath(p, it.v, it.name), u8);
              packed.push(it.name);
            } catch (_) { failed.push(it.name); }
          }
        }
      } finally { setBusy(false); }
      if (!zip.count) { toast('Nie udało się przygotować żadnego pliku.'); return; }
      const fname = chunks.length > 1 ? `${base}_cz${ci + 1}z${chunks.length}.zip` : `${base}.zip`;
      setBusy(true, 'Składam ZIP…', fname);
      const zb = zip.blob();
      setBusy(false);
      try {
        await state.downloads.save({ filename: fname, data: zb });
      } catch (e) {
        const code = e && e.code;
        if (code === 'declined') { toast('Anulowano zapis.'); return; }
        if (code === 'rate_limited') { toast('Poprzednie okno zapisu jest jeszcze otwarte. Spróbuj za chwilę.'); return; }
        if (code === 'too_large') { toast('Plik ZIP jest za duży dla tego miejsca zapisu.'); return; }
        toast('Nie udało się zapisać pliku ZIP.'); return;
      }
    }
    const notes = [];
    if (failed.length) notes.push(`Nie udało się dołączyć:\n${failed.join('\n')}`);
    if (scaled.length) notes.push(`Zmniejszone przez limit Safari (16,7 Mpx):\n${scaled.join('\n')}`);
    if (notes.length) await ask({ title: 'Eksport zakończony z uwagami', text: notes.join('\n\n'), buttons: [{ label: 'OK', value: true }] });
    else if (packed.length <= 6) await ask({ title: `W ZIP-ie jest ${packed.length} z ${total} plików`, text: packed.join('\n'), buttons: [{ label: 'OK', value: true }] });
    else toast(`Gotowe: w ZIP-ie jest ${packed.length} z ${total} plików.`, 5000);
  }

  async function exportPack() {
    const p = curPack(); if (!p) return;
    const comp = state.sets.filter(s => statusOf(s).complete);
    const inc = state.sets.length - comp.length;
    let list = comp;
    if (inc) {
      const r = await ask({ title: 'Część zestawów jest niekompletna', text: `${comp.length} kompletnych, ${inc} niekompletnych.`,
        buttons: [{ label: `Tylko kompletne (${comp.length})`, value: 'c', kind: 'pri' }, { label: `Wszystkie z tym, co mają (${state.sets.length})`, value: 'a' }, { label: 'Anuluj', value: null }] });
      if (!r) return;
      if (r === 'a') list = state.sets;
    }
    const n = list.reduce((k, s) => k + (avail(s, 'lock') ? 2 : 0) + (avail(s, 'home') ? 1 : 0), 0);
    const how = await ask({ title: 'Jak zapisać paczkę?', text: `${list.length} ${list.length === 1 ? 'zestaw' : 'zestawów'}, ${n} plików.`,
      buttons: [{ label: `Osobne pliki (${n} okien zapisu)`, value: 'files', kind: 'pri' }, { label: 'Jeden ZIP z folderami Lock / Home / Blur', value: 'zip' }, { label: 'Anuluj', value: null }] });
    if (how === 'files') saveSeparate(list);
    else if (how === 'zip') exportSets(list, `${PREFIX}_${p.token}_${FORMAT}`);
  }
  async function exportOne(mode) {
    const s = curSet(), p = curPack(); if (!s || !p) return;
    flushNameSave();
    const st = statusOf(s, ed.local);
    if (!avail(s, 'lock') && !avail(s, 'home')) { toast('Ten zestaw nie ma jeszcze żadnego obrazu.'); return; }
    if (!st.complete) {
      const r = await ask({ title: 'Zestaw jest niekompletny', text: `Brakuje: ${st.miss.join(', ')}.`, buttons: [{ label: 'Eksportuj to, co jest', value: true }, { label: 'Anuluj', value: false }] });
      if (!r) return;
    }
    const view = Object.assign({}, s, { car: ed.local.car, shot: ed.local.shot, blur: { amount: ed.local.amount, dim: ed.local.dim } });
    if (mode === 'files') saveSeparate([view]);
    else exportSets([view], `${PREFIX}_${p.token}_${pad3(s.no)}_${partToken(view.car) || 'BRAK-AUTA'}_${partToken(view.shot) || 'BRAK-UJECIA'}_${FORMAT}`, true);
  }

  // ---------------- zdarzenia ----------------
  document.addEventListener('click', e => {
    const pick = e.target.closest('[data-pick]');
    if (pick) { state.pickSlot = pick.dataset.pick; return; }   // label otwiera wybór pliku sam
  }, true);

  $('app').addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if (a) {
      const act = a.dataset.act;
      if (act === 'home') location.hash = '';
      else if (act === 'newPack') newPack();
      else if (act === 'packMenu') packMenu();
      else if (act === 'addSet') addSet();
      else if (act === 'exportPack') exportPack();
      return;
    }
    const f = e.target.closest('#filter button');
    if (f) { state.filter = f.dataset.f; render(); return; }
    const pk = e.target.closest('[data-pack]');
    if (pk) { location.hash = 'p-' + pk.dataset.pack; return; }
    const st = e.target.closest('[data-set]');
    if (st) openEditor(st.dataset.set);
  });

  $('ed').addEventListener('click', e => {
    const a = e.target.closest('[data-ed]'); if (!a) return;
    const act = a.dataset.ed;
    if (act === 'close') closeEditor();
    else if (act === 'slot') slotMenu(a.dataset.slot);
    else if (act === 'viewBlur') {
      const s = curSet(), p = curPack();
      if (ed.last) {
        const t = document.createElement('canvas'); t.width = ed.pW; t.height = ed.pH; t.getContext('2d').putImageData(ed.last, 0, 0);
        openView(t.toDataURL('image/jpeg', 0.9), fileName(p, s, 'Blur', 'jpg', ed.local) + ' · podgląd');
      } else toast('Podgląd Blur jeszcze się liczy.');
    }
    else if (act === 'blurDefault') {
      const p = curPack(); if (!p) return;
      dbw(state.db.doc('packs/' + p.id).update({ blur: { amount: ed.local.amount, dim: ed.local.dim } }), 'domyślne').then(ok => ok && toast('Nowe zestawy dostaną te ustawienia rozmycia.'));
    }
    else if (act === 'blurAll') blurToAll();
    else if (act === 'export') exportOne('zip');
    else if (act === 'exportFiles') exportOne('files');
    else if (act === 'delete') deleteSet();
  });

  $('fileIn').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    const slot = state.pickSlot; state.pickSlot = null;
    if (f && slot && state.edId) assignFile(f, slot);
  });

  // ---------------- start ----------------
  const use = n => {
    try { return (window.claude && window.claude.use) ? Promise.resolve(window.claude.use(n)).catch(() => null) : Promise.resolve(null); }
    catch (_) { return Promise.resolve(null); }
  };
  (async () => {
    const [db, assets, downloads] = await Promise.all([use('db'), use('assets'), use('downloads')]);
    state.db = db; state.assets = assets; state.downloads = downloads; state.booting = false;
    if (!db) { render(); return; }
    const slow = setTimeout(() => { state.packsSlow = true; render(); }, 10000);
    db.collection('packs').onSnapshot(snap => {
      if (!snap.metadata.fromCache) clearTimeout(slow);
      state.packs = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      state.packsReady = true; state.packsSlow = false;
      render();
      if (state.edId) updateEditor();
    }, () => { clearTimeout(slow); state.packsErr = true; render(); });
    route();
  })();
})();
</script>
</body>
</html>
